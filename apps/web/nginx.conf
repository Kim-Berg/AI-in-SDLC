server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files directly
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy API requests to the API container
    # ${API_URL} is replaced at startup via envsubst
    # docker-compose: http://api:3001 | Azure Container Apps: http://zava-api
    location /api/ {
        proxy_pass ${API_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA catch-all — serve index.html for all other routes
    # Required for React Router BrowserRouter (deep links, page refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
