<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Zava Studio Pour-Over Kit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#253038"/>
      <stop offset="100%" stop-color="#64808e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="942" cy="248" r="162" fill="#9fc5d0" opacity="0.12"/>
  <!-- Counter/surface -->
  <rect x="100" y="860" width="1000" height="8" rx="4" fill="#eff6f7" opacity="0.3"/>
  <!-- Pour-over dripper stand -->
  <rect x="290" y="500" width="16" height="360" rx="4" fill="#eff6f7" opacity="0.8"/>
  <rect x="590" y="500" width="16" height="360" rx="4" fill="#eff6f7" opacity="0.8"/>
  <rect x="260" y="850" width="380" height="12" rx="6" fill="#eff6f7" opacity="0.7"/>
  <rect x="260" y="490" width="380" height="12" rx="6" fill="#eff6f7" opacity="0.7"/>
  <!-- Ceramic dripper (cone shape) -->
  <path d="M350 300h200l50 190H300z" fill="#eef5f6"/>
  <ellipse cx="450" cy="300" rx="100" ry="26" fill="#d6e7d9"/>
  <ellipse cx="450" cy="300" rx="80" ry="18" fill="#253038" opacity="0.3"/>
  <!-- Dripper ridges -->
  <path d="M370 340l-20 100" stroke="#c5d8dc" stroke-width="3" opacity="0.5"/>
  <path d="M400 330l-25 120" stroke="#c5d8dc" stroke-width="3" opacity="0.5"/>
  <path d="M430 326l-15 130" stroke="#c5d8dc" stroke-width="3" opacity="0.5"/>
  <path d="M460 326l5 132" stroke="#c5d8dc" stroke-width="3" opacity="0.5"/>
  <path d="M490 330l20 120" stroke="#c5d8dc" stroke-width="3" opacity="0.5"/>
  <path d="M520 340l15 100" stroke="#c5d8dc" stroke-width="3" opacity="0.5"/>
  <!-- Drip from dripper -->
  <line x1="450" y1="490" x2="450" y2="530" stroke="#7ea4af" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <circle cx="450" cy="545" r="4" fill="#7ea4af" opacity="0.4"/>
  <!-- Glass server (carafe) below dripper -->
  <path d="M340 580h220l-20 260c-2 16-16 28-32 28H392c-16 0-30-12-32-28l-20-260z" fill="#eef5f6" opacity="0.5"/>
  <path d="M340 580h220" stroke="#eef5f6" stroke-width="4"/>
  <!-- Coffee in server -->
  <path d="M364 700h172l-12 140c-2 14-14 24-28 24h-92c-14 0-26-10-28-24l-12-140z" fill="#7ea4af" opacity="0.35"/>
  <!-- Server handle -->
  <path d="M560 600c20 0 36 16 36 36v60c0 20-16 36-36 36" fill="none" stroke="#eef5f6" stroke-width="10" opacity="0.5" stroke-linecap="round"/>
  <!-- Paper filters stack (right side) -->
  <g transform="translate(760, 560)">
    <path d="M0 0l100 0l50 220H-50z" fill="#f5f0e8" opacity="0.9"/>
    <path d="M5 6l95 0l46 208H-42z" fill="#ede6dc" opacity="0.7"/>
    <path d="M10 12l90 0l42 196H-34z" fill="#e5ddd2" opacity="0.5"/>
  </g>
  <!-- Measuring spoon -->
  <path d="M700 420c0-22 18-40 40-40s40 18 40 40v10H700v-10z" fill="#d6e7d9"/>
  <rect x="735" y="430" width="10" height="140" rx="4" fill="#c5d8dc"/>
  <!-- Coffee grounds in spoon -->
  <ellipse cx="740" cy="410" rx="28" ry="10" fill="#3a4a44" opacity="0.4"/>
</svg>