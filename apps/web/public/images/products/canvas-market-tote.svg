<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Zava Canvas Market Tote">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#40362d"/>
      <stop offset="100%" stop-color="#8f7d6e"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4ebdf"/>
      <stop offset="100%" stop-color="#e6d8c8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <!-- Shadow underneath -->
  <ellipse cx="600" cy="960" rx="300" ry="30" fill="#2a2218" opacity="0.25"/>
  <!-- Tote bag body -->
  <path d="M280 380h640l-40 560c-4 22-22 38-44 38H364c-22 0-40-16-44-38l-40-560z" fill="url(#canvas)"/>
  <!-- Canvas texture lines -->
  <line x1="310" y1="400" x2="290" y2="920" stroke="#d8c8b4" stroke-width="1" opacity="0.3"/>
  <line x1="380" y1="390" x2="355" y2="940" stroke="#d8c8b4" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="386" x2="430" y2="950" stroke="#d8c8b4" stroke-width="1" opacity="0.3"/>
  <line x1="520" y1="384" x2="508" y2="958" stroke="#d8c8b4" stroke-width="1" opacity="0.3"/>
  <line x1="600" y1="382" x2="600" y2="960" stroke="#d8c8b4" stroke-width="1" opacity="0.3"/>
  <line x1="680" y1="384" x2="692" y2="958" stroke="#d8c8b4" stroke-width="1" opacity="0.3"/>
  <line x1="750" y1="386" x2="770" y2="950" stroke="#d8c8b4" stroke-width="1" opacity="0.3"/>
  <line x1="820" y1="390" x2="845" y2="940" stroke="#d8c8b4" stroke-width="1" opacity="0.3"/>
  <line x1="890" y1="400" x2="910" y2="920" stroke="#d8c8b4" stroke-width="1" opacity="0.3"/>
  <!-- Horizontal texture lines -->
  <line x1="290" y1="500" x2="908" y2="500" stroke="#d8c8b4" stroke-width="1" opacity="0.2"/>
  <line x1="282" y1="600" x2="916" y2="600" stroke="#d8c8b4" stroke-width="1" opacity="0.2"/>
  <line x1="274" y1="700" x2="924" y2="700" stroke="#d8c8b4" stroke-width="1" opacity="0.2"/>
  <line x1="266" y1="800" x2="932" y2="800" stroke="#d8c8b4" stroke-width="1" opacity="0.2"/>
  <!-- Bag opening - slightly open/sagging -->
  <path d="M280 380c60-20 160-30 320-30s260 10 320 30" fill="#e6d8c8"/>
  <path d="M300 380c50-16 140-24 300-24s250 8 300 24" fill="none" stroke="#ceb9a2" stroke-width="2"/>
  <!-- Inside of bag visible -->
  <path d="M300 380c50-16 140-24 300-24s250 8 300 24v30c-50-10-140-16-300-16s-250 6-300 16v-30z" fill="#d0c0ac" opacity="0.5"/>
  <!-- Handles -->
  <path d="M380 380c0-80 20-160 60-200 20-20 40-24 60-20" fill="none" stroke="#ceb9a2" stroke-width="22" stroke-linecap="round"/>
  <path d="M380 380c0-80 20-160 60-200 20-20 40-24 60-20" fill="none" stroke="#e6d8c8" stroke-width="16" stroke-linecap="round"/>
  <path d="M820 380c0-80-20-160-60-200-20-20-40-24-60-20" fill="none" stroke="#ceb9a2" stroke-width="22" stroke-linecap="round"/>
  <path d="M820 380c0-80-20-160-60-200-20-20-40-24-60-20" fill="none" stroke="#e6d8c8" stroke-width="16" stroke-linecap="round"/>
  <!-- Bottom gusset fold -->
  <path d="M300 900l60 60h480l60-60" fill="none" stroke="#ceb9a2" stroke-width="2" opacity="0.4"/>
  <!-- Reinforced bottom corners -->
  <path d="M300 870c10 20 20 40 50 60" fill="none" stroke="#c0a888" stroke-width="3" opacity="0.3"/>
  <path d="M900 870c-10 20-20 40-50 60" fill="none" stroke="#c0a888" stroke-width="3" opacity="0.3"/>
  <!-- Side stitching detail -->
  <g stroke="#b0987c" stroke-width="2" opacity="0.35" stroke-dasharray="8 6">
    <line x1="296" y1="400" x2="260" y2="920"/>
    <line x1="904" y1="400" x2="940" y2="920"/>
  </g>
  <!-- Items peeking out of bag (coffee bag, baguette hint) -->
  <rect x="440" y="320" width="80" height="70" rx="4" fill="#d2a063" opacity="0.4"/>
  <path d="M660 300c4-60 8-100 12-120" stroke="#e6d8c8" stroke-width="14" stroke-linecap="round" opacity="0.5"/>
</svg>