<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Zava Solstice Cold Brew Flight">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d2223"/>
      <stop offset="100%" stop-color="#6c5551"/>
    </linearGradient>
    <linearGradient id="bottle1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9efe6"/>
      <stop offset="40%" stop-color="#f9efe6"/>
      <stop offset="40%" stop-color="#3a2018"/>
      <stop offset="100%" stop-color="#5c3828"/>
    </linearGradient>
    <linearGradient id="bottle2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9efe6"/>
      <stop offset="35%" stop-color="#f9efe6"/>
      <stop offset="35%" stop-color="#4a2d1a"/>
      <stop offset="100%" stop-color="#6b4230"/>
    </linearGradient>
    <linearGradient id="bottle3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9efe6"/>
      <stop offset="45%" stop-color="#f9efe6"/>
      <stop offset="45%" stop-color="#2d1810"/>
      <stop offset="100%" stop-color="#4a2818"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <!-- Wooden tray/board -->
  <rect x="140" y="780" width="920" height="60" rx="12" fill="#8b6b4a"/>
  <rect x="140" y="780" width="920" height="8" rx="4" fill="#a07d5c" opacity="0.5"/>
  <rect x="140" y="832" width="920" height="8" rx="4" fill="#6b5238" opacity="0.5"/>
  <!-- Bottle 1 (left) -->
  <rect x="220" y="280" width="140" height="500" rx="16" fill="url(#bottle1)"/>
  <rect x="248" y="200" width="84" height="100" rx="10" fill="#f9efe6"/>
  <ellipse cx="290" cy="200" rx="42" ry="10" fill="#e8d8c8"/>
  <!-- Bottle cap -->
  <rect x="256" y="180" width="68" height="24" rx="6" fill="#2d2223"/>
  <!-- Bottle 2 (center, taller) -->
  <rect x="480" y="220" width="140" height="560" rx="16" fill="url(#bottle2)"/>
  <rect x="508" y="140" width="84" height="100" rx="10" fill="#f9efe6"/>
  <ellipse cx="550" cy="140" rx="42" ry="10" fill="#e8d8c8"/>
  <rect x="516" y="120" width="68" height="24" rx="6" fill="#2d2223"/>
  <!-- Bottle 3 (right) -->
  <rect x="740" y="310" width="140" height="470" rx="16" fill="url(#bottle3)"/>
  <rect x="768" y="230" width="84" height="100" rx="10" fill="#f9efe6"/>
  <ellipse cx="810" cy="230" rx="42" ry="10" fill="#e8d8c8"/>
  <rect x="776" y="210" width="68" height="24" rx="6" fill="#2d2223"/>
  <!-- Bottle highlights/reflections -->
  <rect x="236" y="300" width="12" height="200" rx="6" fill="#fff" opacity="0.08"/>
  <rect x="496" y="240" width="12" height="240" rx="6" fill="#fff" opacity="0.08"/>
  <rect x="756" y="330" width="12" height="180" rx="6" fill="#fff" opacity="0.08"/>
  <!-- Coffee liquid levels visible through glass -->
  <ellipse cx="290" cy="510" rx="54" ry="8" fill="#5c3828" opacity="0.4"/>
  <ellipse cx="550" cy="480" rx="54" ry="8" fill="#6b4230" opacity="0.4"/>
  <ellipse cx="810" cy="540" rx="54" ry="8" fill="#4a2818" opacity="0.4"/>
  <!-- Tasting glasses in front -->
  <path d="M360 860h80v100c0 16-12 28-28 28h-24c-16 0-28-12-28-28V860z" fill="#f9efe6" opacity="0.7"/>
  <ellipse cx="400" cy="860" rx="40" ry="8" fill="#e8d8c8" opacity="0.6"/>
  <ellipse cx="400" cy="860" rx="30" ry="5" fill="#5c3828" opacity="0.4"/>
  <path d="M620" y="860h80v100c0 16-12 28-28 28h-24c-16 0-28-12-28-28V860z" fill="#f9efe6" opacity="0.7"/>
  <ellipse cx="660" cy="860" rx="40" ry="8" fill="#e8d8c8" opacity="0.6"/>
  <ellipse cx="660" cy="860" rx="30" ry="5" fill="#4a2818" opacity="0.4"/>
  <!-- Ice cubes around -->
  <rect x="180" cy="860" width="24" height="24" rx="4" fill="#fff" opacity="0.12" transform="rotate(15 192 872)"/>
  <rect x="920" cy="840" width="20" height="20" rx="4" fill="#fff" opacity="0.1" transform="rotate(-10 930 850)"/>
</svg>