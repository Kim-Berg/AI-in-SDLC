services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zava
      POSTGRES_USER: zava
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zava-local-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zava']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://zava:${POSTGRES_PASSWORD:-zava-local-dev}@postgres:5432/zava
      JWT_SECRET: ${JWT_SECRET:-zava-docker-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PORT: 3001
    ports:
      - '3001:3001'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  pgdata:
